<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jay Robot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .back-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      display: none;
    }
    header .back-btn:hover { background: rgba(255,255,255,0.25); }

    #app { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    /* ── Project list view ── */
    #view-projects {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .view-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #1a1a2e;
    }

    .create-project-form {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }

    .create-project-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .create-project-form input:focus { border-color: #4f46e5; }

    .btn-primary {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #3730a3; }
    .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }

    .project-list { display: flex; flex-direction: column; gap: 12px; }

    .project-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px 24px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .project-card:hover {
      border-color: #4f46e5;
      box-shadow: 0 2px 8px rgba(79,70,229,0.1);
    }
    .project-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .project-card .meta { font-size: 0.8rem; color: #888; }

    .empty-projects {
      text-align: center;
      color: #aaa;
      padding: 48px 0;
      font-size: 0.95rem;
    }
    .empty-projects p { margin-top: 8px; }

    /* ── Project detail view ── */
    #view-detail {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left sidebar: doc tree + upload */
    .detail-sidebar {
      width: 280px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .sidebar-section h2 {
      font-size: 0.78rem;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    /* Doc tree */
    .doc-tree { flex: 1; overflow-y: auto; padding: 16px; }
    .doc-tree h2 {
      font-size: 0.78rem;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .phase-node { margin-bottom: 4px; }

    .phase-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      user-select: none;
      transition: background 0.15s;
    }
    .phase-header:hover { background: #f5f5f5; }
    .phase-header.has-files { color: #1a1a2e; }
    .phase-header.no-files { color: #bbb; }

    .phase-toggle { font-size: 0.7rem; transition: transform 0.2s; display: inline-block; }
    .phase-toggle.open { transform: rotate(90deg); }

    .phase-label { flex: 1; }
    .phase-count {
      font-size: 0.75rem;
      background: #eef2ff;
      color: #4f46e5;
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 500;
    }
    .phase-count.empty { background: #f5f5f5; color: #ccc; }

    .phase-files { display: none; padding-left: 20px; }
    .phase-files.open { display: block; }

    .phase-file {
      font-size: 0.82rem;
      color: #555;
      padding: 3px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .phase-file span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 點檔名即下載原始檔（讀取操作，唯讀模式也可用） */
    .phase-file .file-name { cursor: pointer; }
    .phase-file .file-name:hover { color: #4f46e5; text-decoration: underline; }
    .phase-file .del-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 2px;
      border-radius: 3px;
      line-height: 1;
      visibility: hidden;
    }
    .phase-file:hover .del-btn { visibility: visible; }
    .phase-file .del-btn:hover { color: #dc2626; background: #fee2e2; }
    .phase-file .move-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0 2px;
      border-radius: 3px;
      line-height: 1;
      visibility: hidden;
    }
    .phase-file:hover .move-btn { visibility: visible; }
    .phase-file .move-btn:hover { color: #4f46e5; background: #eef2ff; }
    .phase-file .move-select {
      font-size: 0.75rem;
      border: 1px solid #4f46e5;
      border-radius: 3px;
      padding: 1px 3px;
      color: #4f46e5;
      background: #fff;
      cursor: pointer;
    }
    .phase-empty-hint {
      font-size: 0.8rem;
      color: #ccc;
      padding: 3px 8px;
      font-style: italic;
    }

    /* Upload area in sidebar */
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      color: #888;
      font-size: 0.82rem;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #4f46e5;
      background: #f0efff;
      color: #4f46e5;
    }
    .drop-zone input { display: none; }

    .phase-select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-top: 8px;
      outline: none;
    }
    .phase-select:focus { border-color: #4f46e5; }

    .upload-btn {
      width: 100%;
      margin-top: 8px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .upload-btn:hover { background: #3730a3; }
    .upload-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    #upload-status {
      font-size: 0.8rem;
      padding: 6px 8px;
      border-radius: 5px;
      margin-top: 6px;
      min-height: 28px;
    }
    #upload-status.success { background: #dcfce7; color: #166534; }
    #upload-status.error   { background: #fee2e2; color: #991b1b; }
    #upload-status.info    { background: #eff6ff; color: #1d4ed8; }

    /* ── Project settings（專案背景說明） ── */
    #project-context-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 8px;
      outline: none;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
    }
    #project-context-input:focus { border-color: #4f46e5; }
    .settings-hint { font-size: 0.78rem; color: #6b7280; }
    #context-status {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 5px;
      margin-top: 6px;
      min-height: 22px;
    }
    #context-status.success { background: #dcfce7; color: #166534; }
    #context-status.error   { background: #fee2e2; color: #991b1b; }

    .or-divider {
      text-align: center;
      color: #9ca3af;
      font-size: 0.78rem;
      margin-top: 10px;
    }

    .vlm-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #555;
      margin-top: 8px;
      cursor: pointer;
      user-select: none;
    }
    .vlm-toggle input { cursor: pointer; }

    #upload-log {
      font-size: 0.72rem;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      background: #1a1a2e;
      color: #7dd87d;
      border-radius: 5px;
      padding: 8px;
      max-height: 110px;
      overflow-y: auto;
      margin-top: 6px;
      display: none;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #upload-log.visible { display: block; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message { max-width: 720px; width: 100%; }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user .bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .assistant .bubble {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .sources {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #666;
    }
    .sources strong { color: #444; }
    .sources ul { padding-left: 16px; margin-top: 4px; }
    .sources li { margin-bottom: 2px; }
    .source-link { cursor: pointer; }

    /* 答案／檢視器內的圖片受限呈現，避免溢出版面 */
    .bubble img, .doc-view img { max-width: 100%; height: auto; display: block; margin: 8px 0; border-radius: 6px; }

    /* 來源檢視器 modal */
    .doc-modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
    .doc-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
    .doc-modal-box { position: relative; background: #fff; width: min(860px, 92vw); max-height: 86vh; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
    .doc-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #eee; font-weight: 600; }
    .doc-modal-head button { border: none; background: none; font-size: 1.4rem; cursor: pointer; color: #888; line-height: 1; }
    .doc-modal-head button:hover { color: #dc2626; }
    .doc-view { padding: 16px 20px; overflow-y: auto; }

    .tool-log { margin-bottom: 6px; }
    .tool-call {
      font-size: 0.78rem;
      color: #6b7280;
      background: #f3f4f6;
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* 生成中指示：等待 LLM 期間泡泡內的跳動點 + 階段文字 */
    .generating { display: flex; align-items: center; gap: 8px; color: #6b7280; font-size: 0.85rem; }
    .generating .dots { display: inline-flex; gap: 3px; }
    .generating .dots i {
      width: 6px; height: 6px; border-radius: 50%; background: #9ca3af;
      animation: gen-bounce 1s infinite ease-in-out;
    }
    .generating .dots i:nth-child(2) { animation-delay: 0.15s; }
    .generating .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes gen-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .input-row {
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    #question-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      height: 44px;
      line-height: 1.4;
    }
    #question-input:focus { border-color: #4f46e5; }
    #question-input:disabled { background: #f9fafb; }

    #send-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #send-btn:hover { background: #3730a3; }
    #send-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .empty-hint {
      margin: auto;
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
    }
    .empty-hint p { margin-top: 8px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" id="back-btn">← 專案列表</button>
    <span id="header-title">🤖 Jay Robot</span>
  </header>
  <div id="app">

    <!-- View: Project List -->
    <div id="view-projects">
      <div class="view-title">專案列表</div>
      <div class="create-project-form">
        <input type="text" id="new-project-name" placeholder="輸入新專案名稱...">
        <button class="btn-primary" id="create-project-btn">建立專案</button>
      </div>
      <div class="project-list" id="project-list">
        <div class="empty-projects" id="projects-empty">
          <div>📁 尚無專案</div>
          <p>建立第一個專案，開始上傳 NPDS 文件</p>
        </div>
      </div>
    </div>

    <!-- View: Project Detail -->
    <div id="view-detail" class="hidden">
      <!-- Left sidebar -->
      <aside class="detail-sidebar">
        <div class="doc-tree" id="doc-tree">
          <h2>文件樹</h2>
          <!-- phases rendered by JS -->
        </div>

        <div class="sidebar-section" id="upload-section">
          <h2>上傳文件</h2>
          <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" accept=".md,.markdown,.pdf,.docx,.pptx,.xlsx,.xls,.html,.htm,.csv,.json,.xml,.epub">
            <div id="drop-label">拖曳 .md / .pdf / Word / Excel / PPT 等檔案到這裡<br>或點擊選取</div>
          </div>
          <select class="phase-select" id="phase-select">
            <option value="">選擇 NPDS 階段...</option>
            <option value="C1">C1 計畫</option>
            <option value="C2">C2 原型</option>
            <option value="C3">C3 EVT</option>
            <option value="C4">C4 DVT</option>
            <option value="C5">C5 PVT</option>
            <option value="C6">C6 量產</option>
            <option value="C7">C7 停產</option>
          </select>
          <label class="vlm-toggle" id="vlm-toggle" style="display:none">
            <input type="checkbox" id="vlm-checkbox">
            啟用 VLM
          </label>
          <button class="upload-btn" id="upload-btn" disabled>上傳</button>
          <div class="or-divider">— 或 —</div>
          <input type="file" id="folder-input" webkitdirectory style="display:none">
          <button class="upload-btn" id="folder-upload-btn" type="button">上傳資料夾（md＋圖＋PDF）</button>
          <div id="upload-status"></div>
          <div id="upload-log"></div>
        </div>

        <div class="sidebar-section" id="project-settings-section">
          <h2>專案設定</h2>
          <span class="settings-hint">專案背景說明（會影響此專案的所有回答，例如說明專案代稱指的是什麼產品）</span>
          <textarea id="project-context-input" rows="5" maxlength="4000"
            placeholder="例：100T 指本專案的產品 EAR-100T7 邊緣運算 Box PC..."></textarea>
          <button class="upload-btn" id="save-context-btn">儲存</button>
          <div id="context-status"></div>
        </div>
      </aside>

      <!-- Chat -->
      <div class="chat-area">
        <div id="messages">
          <div class="empty-hint" id="chat-empty-hint">
            <div>💬 開始提問</div>
            <p>上傳文件後，輸入問題，Jay Robot 會根據 NPDS 文件回答</p>
          </div>
        </div>
        <div class="input-row">
          <textarea id="question-input" placeholder="輸入問題，按 Enter 送出..." rows="1"></textarea>
          <button id="send-btn">送出</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 來源檢視器 -->
  <div id="doc-modal" class="doc-modal hidden">
    <div class="doc-modal-backdrop" id="doc-modal-backdrop"></div>
    <div class="doc-modal-box">
      <div class="doc-modal-head">
        <span id="doc-modal-title"></span>
        <button id="doc-modal-close" title="關閉">×</button>
      </div>
      <div class="doc-view" id="doc-modal-body"></div>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script>
    // ── State ──
    let currentProjectId = null;
    let selectedFile = null;
    let READ_ONLY = false;  // 由 /api/config 決定；true 時隱藏所有寫入入口（僅體驗，後端另有強制阻擋）

    // 啟動時讀取站台模式
    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const cfg = await res.json();
        READ_ONLY = cfg.readOnly === true;
      } catch {
        READ_ONLY = false;
      }
    }

    // 唯讀模式下隱藏靜態的寫入入口：新建專案表單、左側上傳區、專案設定
    function applyReadOnlyUI() {
      const createForm = document.querySelector('.create-project-form');
      const uploadSection = document.getElementById('upload-section');
      const settingsSection = document.getElementById('project-settings-section');
      if (createForm) createForm.classList.toggle('hidden', READ_ONLY);
      if (uploadSection) uploadSection.classList.toggle('hidden', READ_ONLY);
      if (settingsSection) settingsSection.classList.toggle('hidden', READ_ONLY);
    }

    // ── DOM refs ──
    const viewProjects = document.getElementById('view-projects');
    const viewDetail   = document.getElementById('view-detail');
    const backBtn      = document.getElementById('back-btn');
    const headerTitle  = document.getElementById('header-title');

    // Task 8.1: Hash router
    function route() {
      const hash = location.hash || '#/';
      const match = hash.match(/^#\/projects\/([^/]+)$/);
      if (match) {
        showDetail(match[1]);
      } else {
        showProjects();
      }
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', async () => {
      await loadConfig();
      applyReadOnlyUI();
      route();
    });

    // ── View: Project list ──
    function showProjects() {
      currentProjectId = null;
      viewProjects.classList.remove('hidden');
      viewDetail.classList.add('hidden');
      backBtn.style.display = 'none';
      headerTitle.textContent = '🤖 Jay Robot';
      loadProjects();
    }

    // Task 8.2
    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        const projects = await res.json();
        renderProjectList(projects);
      } catch (err) {
        console.error('Failed to load projects', err);
      }
    }

    function renderProjectList(projects) {
      const list = document.getElementById('project-list');
      const empty = document.getElementById('projects-empty');
      const cards = list.querySelectorAll('.project-card');
      cards.forEach(c => c.remove());

      if (!projects.length) {
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      for (const p of projects) {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.innerHTML = `<h3>${escHtml(p.name)}</h3><div class="meta">建立於 ${formatDate(p.created_at)}</div>`;
        card.addEventListener('click', () => { location.hash = `#/projects/${p.id}`; });
        list.appendChild(card);
      }
    }

    // Task 8.3: Create project form
    document.getElementById('create-project-btn').addEventListener('click', async () => {
      const input = document.getElementById('new-project-name');
      const name = input.value.trim();
      if (!name) { input.focus(); return; }

      const btn = document.getElementById('create-project-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const project = await res.json();
        if (!res.ok) { alert(project.error); return; }
        input.value = '';
        location.hash = `#/projects/${project.id}`;
      } catch (err) {
        alert('建立失敗：' + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('new-project-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('create-project-btn').click();
    });

    backBtn.addEventListener('click', () => { location.hash = '#/'; });

    // ── 專案設定：儲存背景說明（追蹤未儲存變更，讓儲存狀態一目瞭然） ──
    let savedProjectContext = '';   // 伺服器上已存的值；與輸入框比對得知是否有未儲存變更
    const contextInput = document.getElementById('project-context-input');
    const contextSaveBtn = document.getElementById('save-context-btn');
    const contextStatus = document.getElementById('context-status');

    function refreshContextSaveState() {
      const dirty = contextInput.value !== savedProjectContext;
      contextSaveBtn.disabled = !dirty;
      contextSaveBtn.textContent = dirty ? '儲存' : '✓ 已儲存';
      if (dirty) {
        contextStatus.textContent = '有未儲存的變更';
        contextStatus.className = '';
      }
    }
    contextInput.addEventListener('input', refreshContextSaveState);

    contextSaveBtn.addEventListener('click', async () => {
      if (!currentProjectId) return;
      const value = contextInput.value;
      contextSaveBtn.disabled = true;
      try {
        const res = await fetch(`/api/projects/${encodeURIComponent(currentProjectId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ context: value }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        savedProjectContext = value;
        contextStatus.textContent = '✓ 已儲存';
        contextStatus.className = 'success';
      } catch (err) {
        contextStatus.textContent = '儲存失敗：' + err.message;
        contextStatus.className = 'error';
      }
      refreshContextSaveState();
    });

    // ── View: Project detail ──
    // Task 8.4
    async function showDetail(projectId) {
      currentProjectId = projectId;
      viewProjects.classList.add('hidden');
      viewDetail.classList.remove('hidden');
      backBtn.style.display = 'inline-block';

      // Load project name for header + 專案背景說明帶入設定欄
      try {
        const res = await fetch('/api/projects');
        const projects = await res.json();
        const p = projects.find(x => x.id === projectId);
        headerTitle.textContent = p ? `🤖 ${p.name}` : '🤖 Jay Robot';
        savedProjectContext = (p && p.context) || '';
        contextInput.value = savedProjectContext;
      } catch {}
      contextStatus.textContent = '';
      contextStatus.className = '';
      refreshContextSaveState();

      // Reset chat
      document.getElementById('messages').innerHTML = `
        <div class="empty-hint" id="chat-empty-hint">
          <div>💬 開始提問</div>
          <p>上傳文件後，輸入問題，Jay Robot 會根據 NPDS 文件回答</p>
        </div>`;

      // Reset upload
      selectedFile = null;
      document.getElementById('upload-btn').disabled = true;
      document.getElementById('drop-label').innerHTML = '拖曳 .md / .pdf / Word / Excel / PPT 等檔案到這裡<br>或點擊選取';
      document.getElementById('phase-select').value = '';
      document.getElementById('upload-status').textContent = '';
      document.getElementById('upload-status').className = '';
      document.getElementById('vlm-toggle').style.display = 'none';
      document.getElementById('upload-log').classList.remove('visible');
      document.getElementById('upload-log').textContent = '';

      loadDocTree();
    }

    // Task 8.5: Document tree
    async function loadDocTree() {
      const PHASES = ['C1','C2','C3','C4','C5','C6','C7'];
      const PHASE_NAMES = {
        C1: 'C1 計畫', C2: 'C2 原型', C3: 'C3 EVT',
        C4: 'C4 DVT', C5: 'C5 PVT', C6: 'C6 量產', C7: 'C7 停產'
      };

      const treeEl = document.getElementById('doc-tree');
      treeEl.innerHTML = '<h2>文件樹</h2>';

      try {
        const res = await fetch(`/api/projects/${currentProjectId}/documents`);
        const tree = await res.json();

        for (const phase of PHASES) {
          const files = tree[phase] || [];
          const hasFiles = files.length > 0;

          const node = document.createElement('div');
          node.className = 'phase-node';

          const header = document.createElement('div');
          header.className = `phase-header ${hasFiles ? 'has-files' : 'no-files'}`;
          header.innerHTML = `
            <span class="phase-toggle">▶</span>
            <span class="phase-label">${PHASE_NAMES[phase]}</span>
            <span class="phase-count ${hasFiles ? '' : 'empty'}">${files.length}</span>
          `;

          const fileList = document.createElement('div');
          fileList.className = 'phase-files';
          if (hasFiles) {
            files.forEach(f => {
              const el = document.createElement('div');
              el.className = 'phase-file';
              el.title = f;

              // 點檔名即下載原始檔（讀取操作，唯讀模式也可用）
              const name = document.createElement('span');
              name.className = 'file-name';
              name.textContent = f;
              name.title = '點擊下載原始檔';
              name.addEventListener('click', e => {
                e.stopPropagation();
                window.location.href = `/api/projects/${encodeURIComponent(currentProjectId)}/documents/${encodeURIComponent(f)}/download`;
              });
              el.appendChild(name);

              // 唯讀模式不渲染搬移 / 刪除按鈕（後端另有 403 阻擋）
              if (READ_ONLY) {
                fileList.appendChild(el);
                return;
              }

              const moveBtn = document.createElement('button');
              moveBtn.className = 'move-btn';
              moveBtn.textContent = '⇄';
              moveBtn.title = '移動階段';
              moveBtn.addEventListener('click', e => {
                e.stopPropagation();
                const sel = document.createElement('select');
                sel.className = 'move-select';
                ['C1','C2','C3','C4','C5','C6','C7'].forEach(p => {
                  const opt = document.createElement('option');
                  opt.value = p;
                  opt.textContent = p;
                  if (p === phase) opt.selected = true;
                  sel.appendChild(opt);
                });
                sel.addEventListener('change', async () => {
                  const newPhase = sel.value;
                  try {
                    await fetch(`/api/projects/${currentProjectId}/documents/${encodeURIComponent(f)}/phase`, {
                      method: 'PATCH',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ phase: newPhase }),
                    });
                    loadDocTree();
                  } catch (err) {
                    alert(`移動失敗：${err.message}`);
                  }
                });
                sel.addEventListener('keydown', e => { if (e.key === 'Escape') loadDocTree(); });
                sel.addEventListener('blur', () => loadDocTree());
                moveBtn.replaceWith(sel);
                sel.focus();
              });

              const delBtn = document.createElement('button');
              delBtn.className = 'del-btn';
              delBtn.textContent = '×';
              delBtn.title = '刪除';
              delBtn.addEventListener('click', async e => {
                e.stopPropagation();
                if (!confirm(`確定刪除「${f}」？此操作無法還原。`)) return;
                try {
                  await fetch(`/api/projects/${currentProjectId}/documents/${encodeURIComponent(f)}`, { method: 'DELETE' });
                  loadDocTree();
                } catch (err) {
                  alert(`刪除失敗：${err.message}`);
                }
              });

              el.appendChild(moveBtn);
              el.appendChild(delBtn);
              fileList.appendChild(el);
            });
          } else {
            const hint = document.createElement('div');
            hint.className = 'phase-empty-hint';
            hint.textContent = '尚未上傳';
            fileList.appendChild(hint);
          }

          header.addEventListener('click', () => {
            const toggle = header.querySelector('.phase-toggle');
            const isOpen = fileList.classList.toggle('open');
            toggle.classList.toggle('open', isOpen);
          });

          node.appendChild(header);
          node.appendChild(fileList);
          treeEl.appendChild(node);
        }
      } catch (err) {
        treeEl.innerHTML += '<div style="color:#aaa;font-size:0.82rem;padding:8px">載入失敗</div>';
      }
    }

    // Task 8.6: Upload with phase selection
    const dropZone  = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const uploadStatus = document.getElementById('upload-status');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) selectFile(fileInput.files[0]); });

    function detectPhase(filename) {
      const m = filename.match(/C([1-7])\d{2}/i);
      return m ? `C${m[1]}` : null;
    }

    function selectFile(file) {
      selectedFile = file;
      document.getElementById('drop-label').textContent = file.name;
      const isPdf = file.name.toLowerCase().endsWith('.pdf');
      document.getElementById('vlm-toggle').style.display = isPdf ? '' : 'none';
      document.getElementById('upload-log').classList.remove('visible');
      document.getElementById('upload-log').textContent = '';
      const autoPhase = detectPhase(file.name);
      // 偵測到代碼就帶入，偵測不到就清空（不沿用上一個檔的殘留 phase）
      document.getElementById('phase-select').value = autoPhase || '';
      checkUploadReady();
      setStatus('', '');
    }

    document.getElementById('phase-select').addEventListener('change', checkUploadReady);

    function checkUploadReady() {
      const phase = document.getElementById('phase-select').value;
      uploadBtn.disabled = !(selectedFile && phase);
    }

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile || !currentProjectId) return;
      const phase = document.getElementById('phase-select').value;
      if (!phase) return;

      const isPdf = selectedFile.name.toLowerCase().endsWith('.pdf');
      const useVlm = isPdf && document.getElementById('vlm-checkbox').checked;
      const logEl = document.getElementById('upload-log');

      uploadBtn.disabled = true;
      setStatus('上傳中...', 'info');
      if (isPdf) { logEl.textContent = ''; logEl.classList.add('visible'); }

      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('project_id', currentProjectId);
      formData.append('phase', phase);
      formData.append('use_vlm', useVlm ? 'true' : 'false');

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });

        // Validation errors return JSON 400 before SSE starts
        if (!res.ok) {
          const data = await res.json();
          setStatus(data.error || '上傳失敗', 'error');
          uploadBtn.disabled = false;
          logEl.classList.remove('visible');
          return;
        }

        // Parse SSE stream
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop();

          for (const part of parts) {
            if (!part.startsWith('data: ')) continue;
            try {
              const event = JSON.parse(part.slice(6));
              if (event.type === 'log') {
                const line = document.createElement('div');
                line.textContent = event.message;
                logEl.appendChild(line);
                logEl.scrollTop = logEl.scrollHeight;
                setStatus('轉換中...', 'info');
              } else if (event.type === 'done') {
                setStatus(`✓ ${event.message}（${event.chunks} 個段落）`, 'success');
                logEl.classList.remove('visible');
                selectedFile = null;
                fileInput.value = '';
                document.getElementById('drop-label').innerHTML = '拖曳 .md / .pdf / Word / Excel / PPT 等檔案到這裡<br>或點擊選取';
                document.getElementById('phase-select').value = '';
                document.getElementById('vlm-toggle').style.display = 'none';
                uploadBtn.disabled = true;
                loadDocTree();
              } else if (event.type === 'error') {
                setStatus(`錯誤：${event.message}`, 'error');
                uploadBtn.disabled = false;
              }
            } catch {}
          }
        }
      } catch (err) {
        setStatus(`網路錯誤：${err.message}`, 'error');
        uploadBtn.disabled = false;
        logEl.classList.remove('visible');
      }
    });

    function setStatus(msg, type) {
      uploadStatus.textContent = msg;
      uploadStatus.className = type;
    }

    // ── 資料夾上傳（md＋圖＋PDF）：選完即驗 → 上傳；409 → 覆蓋確認後重送 ──
    const folderInput = document.getElementById('folder-input');
    const folderUploadBtn = document.getElementById('folder-upload-btn');
    const FOLDER_EXTS = new Set(['.md', '.pdf', '.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.svg']);
    const extOf = name => { const i = name.lastIndexOf('.'); return i < 0 ? '' : name.slice(i).toLowerCase(); };

    folderUploadBtn.addEventListener('click', () => folderInput.click());

    folderInput.addEventListener('change', () => {
      const files = [...folderInput.files];
      folderInput.value = ''; // 允許重選同一資料夾
      if (!files.length) return;

      const rel = f => f.webkitRelativePath || f.name;
      const folderName = rel(files[0]).split('/')[0];

      // 選完即驗：白名單、頂層恰好一個 PDF、頂層至少一個 md — 不合格直接報錯,不上傳
      const illegal = files.filter(f => !FOLDER_EXTS.has(extOf(f.name))).map(rel);
      const topPdf = files.filter(f => rel(f).split('/').length === 2 && extOf(f.name) === '.pdf');
      const topMd  = files.filter(f => rel(f).split('/').length === 2 && extOf(f.name) === '.md');
      const problems = [];
      if (illegal.length) problems.push(`不允許的檔案:${illegal.join('、')}`);
      if (topPdf.length !== 1) problems.push(`頂層需恰好一個 PDF(目前 ${topPdf.length} 個)`);
      if (topMd.length === 0) problems.push('頂層需至少一個 .md');
      if (problems.length) {
        setStatus(`✗「${folderName}」:${problems.join(';')}`, 'error');
        return;
      }
      uploadFolder(files, folderName, false);
    });

    async function uploadFolder(files, folderName, overwrite) {
      if (!currentProjectId) return;
      folderUploadBtn.disabled = true;
      setStatus(`上傳資料夾「${folderName}」(${files.length} 檔)...`, 'info');
      try {
        const fd = new FormData();
        for (const f of files) {
          fd.append('files', f);
          fd.append('paths', f.webkitRelativePath || f.name);
        }
        fd.append('project_id', currentProjectId);
        const phase = document.getElementById('phase-select').value;
        if (phase) fd.append('phase', phase);
        if (overwrite) fd.append('overwrite', 'true');

        const res = await fetch('/api/upload/folder', { method: 'POST', body: fd });
        const body = await res.json();
        if (res.status === 409) {
          folderUploadBtn.disabled = false;
          if (confirm(`文件「${body.docId}」已存在,將整夾替換,確定?`)) {
            return uploadFolder(files, folderName, true);
          }
          setStatus('已取消上傳', '');
          return;
        }
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        setStatus(`✓ ${body.docId}:${body.chunkCount} 個段落、${body.imageCount} 張圖`, 'success');
        loadDocTree();
      } catch (err) {
        setStatus(`✗ ${err.message}`, 'error');
      } finally {
        folderUploadBtn.disabled = false;
      }
    }

    // ── Chat (Task 8.7) ──
    const messagesEl    = document.getElementById('messages');
    const questionInput = document.getElementById('question-input');
    const sendBtn       = document.getElementById('send-btn');
    let currentController = null;

    questionInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
    });
    sendBtn.addEventListener('click', sendQuestion);

    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      if (currentController) { currentController.abort(); currentController = null; }

      const hint = document.getElementById('chat-empty-hint');
      if (hint) hint.remove();

      questionInput.value = '';
      questionInput.disabled = true;
      sendBtn.disabled = true;

      appendMessage('user', question);
      const { bubble, sourcesEl, toolsEl, setStage, removeIndicator } = appendAssistantBubble();
      let answerMd = '';  // 累積原始 Markdown，逐 token 重新渲染

      currentController = new AbortController();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // Task 8.7: include project_id
          body: JSON.stringify({ question, project_id: currentProjectId }),
          signal: currentController.signal,
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6).trim();
            if (raw === '[DONE]') break;
            try {
              const event = JSON.parse(raw);
              if (event.type === 'token') {
                removeIndicator();
                answerMd += event.value;
                bubble.innerHTML = marked.parse(answerMd);
                messagesEl.scrollTop = messagesEl.scrollHeight;
              } else if (event.type === 'tool') {
                setStage(`查詢中：${toolLabel(event.name)}`, '整理答案中…');
                const line = document.createElement('div');
                line.className = 'tool-call';
                const argStr = event.args && Object.keys(event.args).length ? JSON.stringify(event.args) : '';
                line.textContent = `🔧 ${event.name}${argStr ? ' ' + argStr : ''}`;
                toolsEl.appendChild(line);
                messagesEl.scrollTop = messagesEl.scrollHeight;
              } else if (event.type === 'sources') {
                renderSources(sourcesEl, event.value);
              } else if (event.type === 'error') {
                removeIndicator();
                bubble.textContent = event.value;
              }
            } catch {}
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') bubble.textContent = `錯誤：${err.message}`;
      } finally {
        removeIndicator(); // 兜底：[DONE] 無 token、連線中斷、abort 都不留動畫殘影
        currentController = null;
        questionInput.disabled = false;
        sendBtn.disabled = false;
        questionInput.focus();
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // 工具名 → 人話（生成中指示的階段文字用）
    function toolLabel(name) {
      if (name === 'search_documents') return '搜尋文件';
      if (name && name.startsWith('netlist_')) return '查電路';
      return name || '';
    }

    function appendAssistantBubble() {
      const msg = document.createElement('div');
      msg.className = 'message assistant';
      const toolsEl = document.createElement('div');
      toolsEl.className = 'tool-log';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const sourcesEl = document.createElement('div');
      sourcesEl.className = 'sources';

      // 生成中指示：建泡泡時就顯示，首個 token／錯誤／串流結束時移除
      const indicator = document.createElement('div');
      indicator.className = 'generating';
      indicator.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span class="stage">思考中…</span>';
      bubble.appendChild(indicator);
      let stageTimer = null;
      function setStage(text, thenText) {
        const el = indicator.querySelector('.stage');
        if (el) el.textContent = text;
        if (stageTimer) { clearTimeout(stageTimer); stageTimer = null; }
        // 工具本身毫秒級就跑完，之後的等待是下一輪 LLM 推理——短暫顯示工具名後切回生成狀態
        if (thenText) stageTimer = setTimeout(() => setStage(thenText), 1500);
      }
      function removeIndicator() {
        if (stageTimer) { clearTimeout(stageTimer); stageTimer = null; }
        indicator.remove();
      }

      msg.appendChild(toolsEl);
      msg.appendChild(bubble);
      msg.appendChild(sourcesEl);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return { bubble, sourcesEl, toolsEl, setStage, removeIndicator };
    }

    function renderSources(el, sources) {
      if (!sources || sources.length === 0) {
        el.innerHTML = '<strong>來源：</strong>無相關文件';
        return;
      }
      el.innerHTML = `<strong>來源：</strong><ul>${sources.map(s =>
        `<li><a href="#" class="source-link" data-docid="${escHtml(s.docId)}" data-url="${escHtml(s.url)}">${escHtml(s.docId)}</a></li>`
      ).join('')}</ul>`;
      el.querySelectorAll('.source-link').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          openSource(a.dataset.docid, a.dataset.url);
        });
      });
    }

    // 點來源 → 打 view 端點：markdown 型開檢視器渲染（含圖），file 型開原檔（fallback）
    async function openSource(docId, fallbackUrl) {
      try {
        const res = await fetch(`/api/projects/${encodeURIComponent(currentProjectId)}/documents/${encodeURIComponent(docId)}/view`);
        if (!res.ok) throw new Error('view failed');
        const data = await res.json();
        if (data.type === 'markdown') {
          openDocModal(docId, marked.parse(data.markdown));
          return;
        }
        if (data.type === 'file') { window.open(data.url, '_blank', 'noopener'); return; }
        throw new Error('unknown type');
      } catch {
        if (fallbackUrl) window.open(fallbackUrl, '_blank', 'noopener');
      }
    }

    const docModal = document.getElementById('doc-modal');
    function openDocModal(title, html) {
      document.getElementById('doc-modal-title').textContent = title;
      document.getElementById('doc-modal-body').innerHTML = html;
      docModal.classList.remove('hidden');
    }
    function closeDocModal() { docModal.classList.add('hidden'); }
    document.getElementById('doc-modal-close').addEventListener('click', closeDocModal);
    document.getElementById('doc-modal-backdrop').addEventListener('click', closeDocModal);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !docModal.classList.contains('hidden')) closeDocModal(); });

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' });
    }
  </script>
</body>
