<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jay Robot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 12px;
    }

    .sidebar h2 { font-size: 0.85rem; text-transform: uppercase; color: #666; letter-spacing: 0.8px; }

    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      color: #888;
      font-size: 0.9rem;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #4f46e5;
      background: #f0efff;
      color: #4f46e5;
    }
    .drop-zone input { display: none; }

    .upload-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .upload-btn:hover { background: #3730a3; }
    .upload-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    #upload-status {
      font-size: 0.82rem;
      padding: 8px 10px;
      border-radius: 6px;
      min-height: 36px;
    }
    #upload-status.success { background: #dcfce7; color: #166534; }
    #upload-status.error   { background: #fee2e2; color: #991b1b; }
    #upload-status.info    { background: #eff6ff; color: #1d4ed8; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message { max-width: 720px; width: 100%; }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user .bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .assistant .bubble {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .sources {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #666;
    }
    .sources strong { color: #444; }
    .sources ul { padding-left: 16px; margin-top: 4px; }
    .sources li { margin-bottom: 2px; }

    .input-row {
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }

    #question-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      height: 44px;
      line-height: 1.4;
    }
    #question-input:focus { border-color: #4f46e5; }
    #question-input:disabled { background: #f9fafb; }

    #send-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #send-btn:hover { background: #3730a3; }
    #send-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .empty-hint {
      margin: auto;
      text-align: center;
      color: #aaa;
      font-size: 0.95rem;
    }
    .empty-hint p { margin-top: 8px; }
  </style>
</head>
<body>
  <header>🤖 Jay Robot</header>
  <div class="main">
    <!-- Sidebar: Upload -->
    <aside class="sidebar">
      <h2>上傳文件</h2>
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".md,.markdown">
        <div>拖曳 .md 檔案到這裡<br>或點擊選取</div>
      </div>
      <button class="upload-btn" id="upload-btn" disabled>上傳</button>
      <div id="upload-status"></div>
    </aside>

    <!-- Chat -->
    <div class="chat-area">
      <div id="messages">
        <div class="empty-hint">
          <div>📄 先上傳 Markdown 文件</div>
          <p>再輸入問題，Jay Robot 會根據文件內容回答</p>
        </div>
      </div>
      <div class="input-row">
        <textarea id="question-input" placeholder="輸入問題，按 Enter 送出..." rows="1"></textarea>
        <button id="send-btn" disabled>送出</button>
      </div>
    </div>
  </div>

  <script>
    // ── Upload ──
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const uploadStatus = document.getElementById('upload-status');
    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) selectFile(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) selectFile(fileInput.files[0]);
    });

    function selectFile(file) {
      selectedFile = file;
      dropZone.querySelector('div').textContent = file.name;
      uploadBtn.disabled = false;
      setStatus('', '');
    }

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      uploadBtn.disabled = true;
      setStatus('上傳中...', 'info');

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.error || '上傳失敗', 'error');
          uploadBtn.disabled = false;
        } else {
          setStatus(`✓ ${data.message}（${data.chunks} 個段落）`, 'success');
          document.getElementById('send-btn').disabled = false;
          clearEmptyHint();
          selectedFile = null;
          fileInput.value = '';
          dropZone.querySelector('div').textContent = '拖曳 .md 檔案到這裡\n或點擊選取';
        }
      } catch (err) {
        setStatus(`網路錯誤：${err.message}`, 'error');
        uploadBtn.disabled = false;
      }
    });

    function setStatus(msg, type) {
      uploadStatus.textContent = msg;
      uploadStatus.className = type;
    }

    // ── Chat ──
    const messagesEl = document.getElementById('messages');
    const questionInput = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');
    let currentController = null;

    function clearEmptyHint() {
      const hint = messagesEl.querySelector('.empty-hint');
      if (hint) hint.remove();
    }

    questionInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendQuestion();
      }
    });
    sendBtn.addEventListener('click', sendQuestion);

    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      // Abort any in-progress stream
      if (currentController) {
        currentController.abort();
        currentController = null;
      }

      clearEmptyHint();
      questionInput.value = '';
      questionInput.disabled = true;
      sendBtn.disabled = true;

      // User bubble
      appendMessage('user', question);

      // Assistant bubble (streaming)
      const { bubble, sourcesEl } = appendAssistantBubble();

      currentController = new AbortController();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
          signal: currentController.signal,
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6).trim();
            if (raw === '[DONE]') break;

            try {
              const event = JSON.parse(raw);
              if (event.type === 'token') {
                bubble.textContent += event.value;
                messagesEl.scrollTop = messagesEl.scrollHeight;
              } else if (event.type === 'sources') {
                renderSources(sourcesEl, event.value);
              } else if (event.type === 'error') {
                bubble.textContent = event.value;
              }
            } catch {}
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          bubble.textContent = `錯誤：${err.message}`;
        }
      } finally {
        currentController = null;
        questionInput.disabled = false;
        sendBtn.disabled = false;
        questionInput.focus();
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendAssistantBubble() {
      const msg = document.createElement('div');
      msg.className = 'message assistant';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const sourcesEl = document.createElement('div');
      sourcesEl.className = 'sources';

      msg.appendChild(bubble);
      msg.appendChild(sourcesEl);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return { bubble, sourcesEl };
    }

    function renderSources(el, sources) {
      if (!sources || sources.length === 0) {
        el.innerHTML = '<strong>來源：</strong>無相關文件';
        return;
      }
      const items = sources.map(s => `<li>${s}</li>`).join('');
      el.innerHTML = `<strong>來源：</strong><ul>${items}</ul>`;
    }
  </script>
</body>
</html>
